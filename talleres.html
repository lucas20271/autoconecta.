<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Directorio Completo | AutoConecta</title>
    <link rel="manifest" href="manifest.json">
    <meta property="og:title" content="AutoConecta - Directorio de Talleres">
    <meta property="og:description" content="Encuentra los mejores talleres, repuestos y servicios automotrices.">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="logo"><a href="index.html" style="color: inherit; text-decoration: none;">🔧 AutoConecta</a></div>
        <nav class="main-nav" style="position: relative; z-index: 9999;"><a href="talleres.html" style="cursor: default; display: inline-block; padding: 10px; font-weight: bold; color: #e63946; border-bottom: 3px solid #e63946;">Todos los Talleres</a></nav>
        <div class="search-container" style="position: relative; z-index: 10;"><input type="text" id="buscador" class="search-bar" placeholder="Busca servicios, motos, etc..."></div>
        <div class="user-actions" id="user-actions-container" style="position: relative; z-index: 9999;"></div>
    </header>

    <button class="btn-flotante-filtros" onclick="toggleFiltrosMovil()">🔍 Filtros</button>

    <div class="layout-wrapper">
        <aside class="sidebar">
            <div style="display: flex; justify-content: space-between;">
                <h3 style="color: var(--text-main);">Filtros de Búsqueda</h3>
                <button onclick="toggleFiltrosMovil()" style="background:none;border:none;font-size:20px;" class="btn-flotante-filtros">❌</button>
            </div>
            
            <div class="filter-group">
                <strong>Disponibilidad Horaria</strong>
                <label><input type="checkbox" value="abierto" onchange="aplicarFiltros()"> 🟢 Abierto Ahora</label>
                <label><input type="checkbox" value="domingos" onchange="aplicarFiltros()"> 📅 Abre Domingos</label>
                <label><input type="checkbox" value="festivos" onchange="aplicarFiltros()"> 🏖️ Abre Festivos</label>
            </div>

            <div class="filter-group">
                <strong>Tipo de Vehículo</strong>
                <label><input type="checkbox" value="motos" onchange="aplicarFiltros()"> Motocicletas</label>
                <label><input type="checkbox" value="livianos" onchange="aplicarFiltros()"> Vehículos Livianos</label>
                <label><input type="checkbox" value="pesados" onchange="aplicarFiltros()"> Carga Pesada</label>
                <label><input type="checkbox" value="electricos" onchange="aplicarFiltros()"> Eléctricos / Híbridos</label>
            </div>
            
            <div class="filter-group">
                <strong>Especialidad Principal</strong>
                <label><input type="checkbox" value="mecanica" onchange="aplicarFiltros()"> Mecánica General</label>
                <label><input type="checkbox" value="repuestos" onchange="aplicarFiltros()"> Venta de Repuestos</label>
                <label><input type="checkbox" value="latoneria" onchange="aplicarFiltros()"> Latonería y Pintura</label>
                <label><input type="checkbox" value="electricidad" onchange="aplicarFiltros()"> Electricidad Automotriz</label>
            </div>

            <div class="filter-group">
                <strong>Servicios Específicos</strong>
                <label><input type="checkbox" value="aceite" onchange="aplicarFiltros()"> Cambio de Aceite</label>
                <label><input type="checkbox" value="frenos" onchange="aplicarFiltros()"> Frenos y Suspensión</label>
                <label><input type="checkbox" value="llantas" onchange="aplicarFiltros()"> Llantas y Alineación</label>
                <label><input type="checkbox" value="escaner" onchange="aplicarFiltros()"> Escáner Computarizado</label>
                <label><input type="checkbox" value="baterias" onchange="aplicarFiltros()"> Venta de Baterías</label>
            </div>

            <div class="filter-group">
                <strong>Comodidades y Pagos</strong>
                <label><input type="checkbox" value="tarjetas" onchange="aplicarFiltros()"> Acepta Tarjetas / Nequi</label>
                <label><input type="checkbox" value="espera" onchange="aplicarFiltros()"> Sala de Espera</label>
                <label><input type="checkbox" value="wifi" onchange="aplicarFiltros()"> Wi-Fi Gratis</label>
            </div>

            <button class="btn-filter" style="background: var(--bg-main); border: 1px solid var(--border-color); color: var(--text-main);" onclick="mostrarTodos()">Limpiar Filtros</button>
        </aside>

        <main class="list-content" id="contenedor-talleres"></main>

        <section class="map-container">
            <div class="map-wrapper" style="position: relative; width: 100%; height: 100%;">
                <iframe id="mapa-google" src="https://maps.google.com/maps?q=4.677010,-74.149393&hl=es&z=17&output=embed" width="100%" height="100%" style="border:0; position: absolute; top:0; left:0;"></iframe>
                
                <!-- BOTÓN RESTAURADO: Abre Google Maps en una nueva pestaña (target="_blank") -->
                <a id="btn-como-llegar" href="#" target="_blank" style="display:none; position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%); background: #28a745; color: #fff; padding: 12px 25px; border-radius: 30px; font-weight: bold; text-decoration: none; box-shadow: 0 4px 15px rgba(0,0,0,0.4); z-index: 5; flex-direction: row; align-items: center; gap: 8px; transition: transform 0.2s;">
                    <span style="font-size: 18px;">📍</span> Cómo llegar
                </a>
                
                <div id="aviso-mapa-restringido" style="display: none; position: absolute; top:0; left:0; width: 100%; height: 100%; background: #fff3cd; color: #856404; padding: 20px; text-align: center; box-sizing: border-box; align-items: center; justify-content: center; flex-direction: column; z-index: 10;">
                    <span style="font-size: 36px; margin-bottom: 10px;">🔒</span>
                    <h3 style="margin: 0 0 5px 0;">Mapa Restringido</h3>
                    <p style="font-size: 13px; margin: 0;">Este establecimiento opera bajo el <strong>Plan Estándar (Gratis)</strong>.</p>
                </div>
            </div>
        </section>
    </div>
    <script src="js/main.js"></script>
</body>
</html>
